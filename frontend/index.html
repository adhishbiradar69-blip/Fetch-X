<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235b4fe9'/%3E%3Cpath d='M19 10l-7-3.5L5 10l7 3.5L19 10z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M8.5 12.5v3c0 1 1.6 1.8 3.5 1.8s3.5-.8 3.5-1.8v-3' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch-X — Intelligent School Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap" rel="stylesheet" />
    <script>
      /* Apply persisted colour mode before first paint (no flash).
         Honours 'system' (the default) via prefers-color-scheme, so OS-dark
         users no longer get a white flash before React mounts. */
      (function () {
        function resolvedMode() {
          try {
            var raw = localStorage.getItem('fx-prefs');
            if (raw) {
              var p = JSON.parse(raw);
              if (p && p.mode === 'dark') return 'dark';
              if (p && p.mode === 'light') return 'light';
            }
            var m = localStorage.getItem('fx-mode');
            if (m === 'dark') return 'dark';
            if (m === 'light') return 'light';
          } catch (e) {}
          try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
          } catch (e) {}
          return 'light';
        }
        var mode = resolvedMode();
        document.documentElement.setAttribute('data-mode', mode);
        (function applyOnBody() {
          if (document.body) {
            if (mode === 'dark') document.body.classList.add('dark');
          } else {
            document.addEventListener('DOMContentLoaded', applyOnBody);
          }
        })();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
